sonar.projectKey=metaver5o_counters-proto
sonar.organization=metaver5o
sonar.projectName=Bitcoin Counters Web App
sonar.projectVersion=1.0

sonar.sources=counters_proto
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  web/node_modules/**,\
  web/dist/**,\
  web/.svelte-kit/**,\
  counters_proto/server/static/assets/**,\
  data/**,\
  **/__pycache__/**,\
  **/*.pyc

sonar.coverage.exclusions=\
  tests/**,\
  counters_proto/__main__.py,\
  counters_proto/commands/**,\
  counters_proto/server/ai_routes.py
